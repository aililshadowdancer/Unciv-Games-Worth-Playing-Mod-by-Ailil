name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Virtual Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-apps xvfb

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Pack Mod Folders Natively
        run: |
          # Forces the game loader to output its own official texture sheet configurations inside an isolated block
          timeout 30s xvfb-run --server-args="-screen 0 1024x768x24" java -jar Unciv.jar --pack-mod Images --headless --json-atlases || true

      - name: Move Generated Assets to Root
        run: |
          # Extract the cleanly compiled engine assets from the subfolder workspace out to your main page layout
          if [ -f "Images/Atlases.json" ]; then
            mv Images/Atlases.json ./Atlases.json
          fi
          if [ -f "Images/BuildingIcons.png" ]; then mv Images/BuildingIcons.png ./BuildingIcons.png; fi
          if [ -f "Images/NationIcons.png" ]; then mv Images/NationIcons.png ./NationIcons.png; fi
          if [ -f "Images/UnitIcons.png" ]; then mv Images/UnitIcons.png ./UnitIcons.png; fi

      - name: Clean Pipeline Rest
        run: |
          rm -f Unciv.jar Images/*.atlas 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add BuildingIcons.png NationIcons.png UnitIcons.png Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed isolated error-free mobile textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No file state updates registered."
          fi
          
