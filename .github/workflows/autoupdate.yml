name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Virtual Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-apps xvfb

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Official Desktop Texture Packer Launcher
        run: |
          # Launches the true desktop texture compiler backend with phone data formatting flags
          if [ -d "Images" ]; then
            timeout 30s xvfb-run --server-args="-screen 0 1024x768x24" java -cp Unciv.jar com.unciv.app.desktop.DesktopLauncher --pack-mod . --headless --json-atlases || true
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Remove Duplicate Layout Artifacts
        run: |
          # Force deletes internal cache maps so only one clean root Atlases.json file remains
          rm -f Images/Atlases.json Images/game.atlas Unciv.jar 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add game.png Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified single-sheet mod textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
