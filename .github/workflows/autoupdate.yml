name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Virtual Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-apps xvfb

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Official Headless Multi-Packer
        run: |
          # Uses Unciv's official multi-atlas engine flag to automatically format and name all sheets safely
          timeout 30s xvfb-run --server-args="-screen 0 1024x768x24" java -jar Unciv.jar --pack-mod . --headless --json-atlases || true

      - name: Clean Temporary Assets
        run: |
          rm -f Unciv.jar 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add BuildingIcons.png NationIcons.png UnitIcons.png Atlases.json game.png game.atlas 2>/dev/null || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free native multi-sheet textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found."
          fi
          
