name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Create Temporary Mod Directory Layout
        run: |
          # Unciv desktop packer needs the images contained inside a "mods/YourModName" structure to trigger hooks
          mkdir -p mock_game/mods/MyCustomMod
          cp -r Images mock_game/mods/MyCustomMod/
          cp Unciv.jar mock_game/

      - name: Run Native Unciv Automated Packer
        run: |
          cd mock_game
          # Launches headless Unciv which detects the loose folder and compiles game.png and game.atlas automatically
          java -jar Unciv.jar --pack MyCustomMod
          cd ..
          
          # Move the flawless cloud-compiled outputs back to your main repository root
          cp mock_game/mods/MyCustomMod/game.png .
          cp mock_game/mods/MyCustomMod/game.atlas .

      - name: Write Official Atlases Rule File
        run: |
          echo '["game"]' > Atlases.json

      - name: Clean Pipeline Assets
        run: |
          rm -rf mock_game Unciv.jar 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Ensure Git explicitly tracks the assets
          git add game.png game.atlas Atlases.json
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified single-sheet mod textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
