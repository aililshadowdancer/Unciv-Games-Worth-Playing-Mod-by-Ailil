name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Virtual Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-apps xvfb

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Headless Texture Packer
        run: |
          timeout 15s xvfb-run --server-args="-screen 0 1024x768x24" java -jar Unciv.jar --pack-mod . --headless || true

      - name: Rename Atlas for Mobile Compatibility
        run: |
          if [ -f "game.atlas" ]; then
            mv game.atlas Atlases.json
            echo "Successfully found and prepared text map configs."
          fi

      - name: Force Save Changes into Blank Placeholders
        uses: EndBug/add-and-commit@v9
        with:
          add: 'game.png Atlases.json'
          default_author: github_actions
          message: 'Auto-packed mobile mod textures and populated placeholders'
          
