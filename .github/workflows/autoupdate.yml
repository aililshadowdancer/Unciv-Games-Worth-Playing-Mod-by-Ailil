name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Core Gdx Texture Packer
        run: |
          if [ -d "Images" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images . game
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Formulate Valid Atlases JSON
        run: |
          if [ -f "game.atlas" ]; then
            echo "[" > Atlases.json
            echo "  {" >> Atlases.json
            echo "    \"name\": \"game.png\"," >> Atlases.json
            echo "    \"sprites\": [" >> Atlases.json
            
            # Convert raw text entries into valid JSON strings
            grep -E '^[a-zA-Z0-9_\-]+$' game.atlas | sed 's/.*/      "\0",/' >> Atlases.json
            
            # Clean up the trailing comma from the last element
            sed -i '$ s/,$//' Atlases.json
            
            echo "    ]" >> Atlases.json
            echo "  }" >> Atlases.json
            echo "]" >> Atlases.json
            rm game.atlas
            echo "Successfully formulated valid JSON mapping schema!"
          fi

      - name: Force Save Changes into Blank Placeholders
        uses: EndBug/add-and-commit@v9
        with:
          add: 'game.png Atlases.json'
          default_author: github_actions
          message: 'Generated true JSON texture mappings'
          
