name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Virtual Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-apps xvfb

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Native Unciv Packer
        run: |
          # Run the official texture packer natively to handle coordinates safely
          timeout 30s xvfb-run --server-args="-screen 0 1024x768x24" java -jar Unciv.jar --pack-mod . --headless --json-atlases || true

      - name: Sanitize and Flatten Atlases JSON
        run: |
          node -e '
          const fs = require("fs");
          const path = "Atlases.json";
          
          if (!fs.existsSync(path)) {
            console.log("Error: Atlases.json was not generated by the game engine.");
            process.exit(1);
          }
          
          // Read the broken map data written by Unciv
          let data = fs.readFileSync(path, "utf8");
          let atlases = JSON.parse(data);
          
          let cleanedAtlases = atlases.map(atlas => {
            // Strip paths out of the image file name (e.g. "Images/BuildingIcons.png" -> "BuildingIcons.png")
            let cleanImageName = atlas.name.split("/").pop().split("\\").pop();
            
            // Clean up every individual icon tracking key inside the array
            let cleanSprites = atlas.sprites.map(sprite => {
              // Strip out any subfolder prefixes or directory headers from tracking keys
              return sprite.replace(/^(Images|BuildingIcons|NationIcons|UnitIcons)[\/\\]/g, "").split("/").pop().split("\\").pop();
            }).filter(sprite => sprite && !sprite.includes(":"));
            
            return {
              name: cleanImageName,
              sprites: [...new Set(cleanSprites)] // Drop duplicates cleanly
            };
          }).filter(atlas => atlas.name.endsWith(".png") && atlas.sprites.length > 0);
          
          // Overwrite the file with clean text formatting that matches your ruleset JSONs exactly
          fs.writeFileSync(path, JSON.stringify(cleanedAtlases, null, 2));
          console.log("Success: Atlases.json has been perfectly sanitized for Android!");
          '

      - name: Relocate Loose Textures to Root
        run: |
          # Move files generated inside subfolders to the main workspace root folder layout
          find . -name "BuildingIcons.png" -exec mv {} ./BuildingIcons.png \; 2>/dev/null || true
          find . -name "NationIcons.png" -exec mv {} ./NationIcons.png \; 2>/dev/null || true
          find . -name "UnitIcons.png" -exec mv {} ./UnitIcons.png \; 2>/dev/null || true

      - name: Clean Pipeline Rest
        run: |
          rm -f Unciv.jar 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add BuildingIcons.png NationIcons.png UnitIcons.png Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed natively sanitized flat mobile multi-sheet textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
