name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Clean Pipeline Workspace and Cache
        run: |
          # Purges any leftover fragments or numbered sheets from previous failed runs
          rm -f Icons*.* Atlases.json game.png game.atlas 2>/dev/null || true

      - name: Write Texture Packer Custom Rules
        run: |
          # Creates the required configuration directly inside your source folder
          # This forces a large canvas layout without flattening your subdirectory paths
          echo '{
            "maxWidth": 2048,
            "maxHeight": 2048,
            "combineSubdirectories": false,
            "flattenPaths": false
          }' > Images/pack.json

      - name: Run Official LibGDX Packer
        run: |
          if [ -d "Images" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images . Icons
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Force Cache-Busting Image Link
        run: |
          sed -i "1s/Icons.png/Icons.png?v=${{ github.sha }}/" Icons.atlas

      - name: Write Official Atlases Rule File
        run: |
          echo '["Icons"]' > Atlases.json

      - name: Clean Pipeline Assets
        run: |
          # Removes the temporary file so it does not permanently clutter your images folder
          rm -f Unciv.jar Images/pack.json 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add Icons.png Icons.atlas Atlases.json
          git rm -f game.png game.atlas Icons1.png Icons2.png Icons3.png 2>/dev/null || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified single-sheet mod textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
