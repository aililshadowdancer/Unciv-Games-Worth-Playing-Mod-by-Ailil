name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Virtual Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-apps xvfb

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Headless Texture Packer
        run: |
          timeout 15s xvfb-run --server-args="-screen 0 1024x768x24" java -jar Unciv.jar --pack-mod . --headless || true

      - name: Locate and Move Texture Assets
        run: |
          echo "=== Relocating Hidden Textures ==="
          find . -name "game.png" -exec cp {} . \; 2>/dev/null || true
          find . -name "game.atlas" -exec cp {} ./game.atlas \; 2>/dev/null || true
          find . -name "Atlases.json" -exec cp {} ./Atlases.json \; 2>/dev/null || true
          
          if [ -f "game.atlas" ]; then
            mv game.atlas Atlases.json
            echo "Successfully pulled and converted texture data files!"
          fi

      - name: Force Commit and Push Assets
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add game.png Atlases.json 2>/dev/null || true
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed images into game.png and Atlases.json"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Error: Unciv engine processed rules but generated 0 graphics assets. Double check your Images folder content."
          fi
          
