name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Official LibGDX Packer
        run: |
          if [ -d "Images" ]; then
            # Create a simple JSON settings override inside the pipeline to fix the blank circles
            echo '{"stripWhitespaceX": false, "stripWhitespaceY": false, "combineSubdirectories": true}' > pack.json
            
            # Runs your original background processor seamlessly using the new settings structure
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images . game pack.json
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Write Official Atlases Rule File
        run: |
          # Writes the clean, native array template format that Unciv checks for validation
          echo '["game"]' > Atlases.json

      - name: Clean Pipeline Assets
        run: |
          rm -f Unciv.jar pack.json 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add game.png game.atlas Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified single-sheet mod textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
