name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Pack All Target Image Folders
        run: |
          # Individual commands to process each separate icon directory branch
          if [ -d "Images/BuildingIcons" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images/BuildingIcons . BuildingIcons
          fi
          if [ -d "Images/NationIcons" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images/NationIcons . NationIcons
          fi
          if [ -d "Images/UnitIcons" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images/UnitIcons . UnitIcons
          fi

      - name: Compile Unified Mobile Atlases JSON
        run: |
          node -e '
          const fs = require("fs");
          const targetSheets = ["BuildingIcons", "NationIcons", "UnitIcons"];
          const outputObj = [];

          for (const sheet of targetSheets) {
            const atlasPath = `${sheet}.atlas`;
            if (!fs.existsSync(atlasPath)) continue;

            const data = fs.readFileSync(atlasPath, "utf8");
            const lines = data.split(/\r?\n/);
            const spriteNames = [];
            let foundFirstImage = false;

            for (let line of lines) {
              line = line.trim();
              if (!line) continue;
              if (line.startsWith("size:") || line.startsWith("format:") || line.startsWith("filter:") || line.startsWith("repeat:")) {
                foundFirstImage = true;
                continue;
              }
              if (!foundFirstImage) continue;
              if (line.startsWith("xy:") || line.startsWith("size:") || line.startsWith("orig:") || line.startsWith("offset:") || line.startsWith("index:")) {
                continue;
              }
              if (line === `${sheet}.png`) continue;

              spriteNames.push(line);
            }

            outputObj.push({
              name: `${sheet}.png`,
              sprites: spriteNames
            });
          }

          fs.writeFileSync("Atlases.json", JSON.stringify(outputObj, null, 2));
          console.log("Multi-atlas JSON configuration mapping completed!");
          '

      - name: Clean Temporary Pipeline Assets
        run: |
          rm -f *.atlas Unciv.jar 2>/dev/null || true

      - name: Force Save Multi-Sheet Graphics to Placeholders
        uses: EndBug/add-and-commit@v9
        with:
          add: 'BuildingIcons.png NationIcons.png UnitIcons.png Atlases.json'
          default_author: github_actions
          message: 'Compiled multiple texture sheets for buildings, units, and nations'
          
