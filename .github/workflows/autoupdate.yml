name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Official LibGDX Packer
        run: |
          if [ -d "Images" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images . game
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Force Cache-Busting Image Link and Fix Atlas Paths
        run: |
          # 1. Appends a unique system timestamp to force Unciv web downloader updates
          sed -i "1s/game.png/game.png?v=${{ github.sha }}/" game.atlas

          # 2. Fixes the Nation Icon name path rule
          sed -i 's/^NationIcons-Unseelie-Sidhe$/NationIcons\/Unseelie-Sidhe/g' game.atlas

          # 3. Injects UnitIcons/ prefix for custom units
          for unit in Warlock Witch-Knight Eldritch-Knight War-Dancer Dock-Alfari-Adept Dock-Alfari-Acolyte Dock-Alfari-Assassin Dock-Alfari-Ranger Dragon-Spear-Ballista Marks-Mage Spell-Sniper; do
            sed -i "s/^${unit}$/UnitIcons\/${unit}/g" game.atlas
          done

          # 4. Injects BuildingIcons/ prefix for custom buildings
          for bldg in Ceilidh-Hall Dancing-Cavern Masquerade-Ball Sylvan-Blessing Hidden-Paths Stone-Circle Trial-by-Combat; do
            sed -i "s/^${bldg}$/BuildingIcons\/${bldg}/g" game.atlas
          done

      - name: Write Official Atlases Rule File
        run: |
          echo '["game"]' > Atlases.json

      - name: Clean Pipeline Assets
        run: |
          rm -f Unciv.jar 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add game.png game.atlas Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified single-sheet mod textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
