name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Extract Texture Packer Tools
        run: |
          mkdir -p packer_libs
          unzip Unciv.jar -d packer_libs/

      - name: Run Core Gdx Texture Packer
        run: |
          if [ -d "Images" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images . game
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Convert Output for Mobile
        run: |
          if [ -f "game.atlas" ]; then
            mv game.atlas Atlases.json
            echo "Data file successfully renamed to Atlases.json!"
          fi

      - name: Force Save Changes into Blank Placeholders
        uses: EndBug/add-and-commit@v9
        with:
          add: 'game.png Atlases.json'
          default_author: github_actions
          message: 'Core compiled textures successfully generated'
          
