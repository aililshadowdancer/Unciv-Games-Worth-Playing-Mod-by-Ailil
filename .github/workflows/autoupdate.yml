name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Clean Pipeline Workspace and Cache
        run: |
          # Purges any leftover or failed Multi-sheet iterations before compiling
          rm -f Icons*.* Atlases.json game.png game.atlas 2>/dev/null || true

      - name: Write Texture Packer Custom Rules
        run: |
          # Writes the strict single-line configuration file exactly inside the target Images folder
          echo '{"maxWidth":2048,"maxHeight":2048,"combineSubdirectories":false,"flattenPaths":false}' > Images/pack.json

      - name: Run Official LibGDX Packer
        run: |
          if [ -d "Images" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images . game
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Force Cache-Busting Image Link
        run: |
          sed -i "1s/game.png/game.png?v=${{ github.sha }}/" game.atlas

      - name: Write Official Atlases Rule File
        run: |
          echo '["game"]' > Atlases.json

      - name: Clean Pipeline Assets
        run: |
          rm -f Unciv.jar Images/pack.json 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Force Git to track only the proper game files
          git add game.png game.atlas Atlases.json
          
          # Physically remove any old incorrect 'Icons' file iterations from the repository
          git rm --ignore-unmatch -f Icons*.* Icons1.png Icons2.png Icons3.png 2>/dev/null || true
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified single-sheet mod textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Workspace is already perfectly updated."
          fi
          
