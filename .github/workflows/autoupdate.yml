name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Virtual Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y x11-apps xvfb

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Core Gdx Texture Packer
        run: |
          # Packs the raw texture blocks accurately into separate desktop atlas formats
          if [ -d "Images/BuildingIcons" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images/BuildingIcons . BuildingIcons
          fi
          if [ -d "Images/NationIcons" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images/NationIcons . NationIcons
          fi
          if [ -d "Images/UnitIcons" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images/UnitIcons . UnitIcons
          fi

      - name: Convert Atlases to Mobile Native Format
        run: |
          # Bypasses complex script engines and converts sheets directly using Unciv's internal cross-platform compiler
          xvfb-run --server-args="-screen 0 1024x768x24" java -jar Unciv.jar --pack-mod . --headless --json-atlases || true

      - name: Clean Pipeline Rest
        run: |
          rm -f *.jar *.atlas 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add BuildingIcons.png NationIcons.png UnitIcons.png Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed natively validated mobile multi-sheet textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found."
          fi
          
