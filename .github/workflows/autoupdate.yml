name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Official Unciv Texture Packer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Downloads the dedicated texture packer tool built specifically by the Unciv development team
          gh release download --repo yairm210/Unciv --pattern "UncivTexturePacker.jar" --output UncivTexturePacker.jar

      - name: Compile Official Graphics Sheets
        run: |
          # Runs the developer tool natively on your flat images directory layout
          if [ -d "Images" ]; then
            java -jar UncivTexturePacker.jar Images . game
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Clean Pipeline Assets
        run: |
          rm -f UncivTexturePacker.jar 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add game.png Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified developer-certified textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
