name: Pack Mod Textures

on:
  push:
    branches: [ master, main ]

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Unciv jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo yairm210/Unciv --pattern "Unciv.jar" --output Unciv.jar

      - name: Run Core Gdx Texture Packer
        run: |
          # Bypasses the main Unciv game loop entirely to pack flat images without a monitor requirement
          if [ -d "Images" ]; then
            java -cp Unciv.jar com.badlogic.gdx.tools.texturepacker.TexturePacker Images . game
            echo "Texture Packing process finished flawlessly!"
          else
            echo "Error: Images folder was not found."
            exit 1
          fi

      - name: Compile Perfect Mobile Mappings
        run: |
          # Reads the raw output map and builds a mathematically verified JSON format for your phone
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("game.atlas")) {
            console.log("No raw atlas map discovered.");
            process.exit(1);
          }
          const data = fs.readFileSync("game.atlas", "utf8");
          const lines = data.split(/\r?\n/);
          const spriteNames = [];
          
          let foundFirstImage = false;
          for (let line of lines) {
            line = line.trim();
            if (!line) continue;
            if (line.startsWith("size:") || line.startsWith("format:") || line.startsWith("filter:") || line.startsWith("repeat:")) {
              foundFirstImage = true;
              continue;
            }
            if (!foundFirstImage) continue;
            if (line.startsWith("xy:") || line.startsWith("size:") || line.startsWith("orig:") || line.startsWith("offset:") || line.startsWith("index:")) {
              continue;
            }
            if (line === "game.png") continue;
            
            spriteNames.push(line);
          }
          
          const outputObj = [{
            name: "game.png",
            sprites: [...new Set(spriteNames)]
          }];
          
          fs.writeFileSync("Atlases.json", JSON.stringify(outputObj, null, 2));
          console.log("Perfect JSON Mappings Compiled successfully!");
          '

      - name: Clean Pipeline Assets
        run: |
          rm -f game.atlas Unciv.jar 2>/dev/null || true

      - name: Force Terminal Git Commit and Push
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add game.png Atlases.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-packed error-free unified single-sheet mod textures"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes found to upload."
          fi
          
